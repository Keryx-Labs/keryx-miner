name: Build and upload assets
on:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, windows-latest ]
        features: ["default", "keryxcuda/overclock"]
    name: Building, ${{ matrix.os }} ${{ matrix.features }}
    steps:
      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Fix LibOpenCL on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install ocl-icd-opencl-dev -y

      - name: Check out code into the Go module directory
        uses: actions/checkout@v2

      - name: Install Protoc
        uses: arduino/setup-protoc@v1

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install CUDA Linux
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.2.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'

      - name: Install CUDA Windows
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.2.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas"]'

      - name: Build on Linux GNU
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo build --target=x86_64-unknown-linux-gnu --release --all --features ${{ matrix.features }}
          feature_name=${{ matrix.features }}
          asset_name="kaspa-miner-${{ github.event.release.tag_name }}-${feature_name/\//-}-linux-gnu-amd64"
          strip ./target/x86_64-unknown-linux-gnu/release/keryx-miner
          mkdir ${asset_name}
          mv ./target/x86_64-unknown-linux-gnu/release/keryx-miner ${asset_name}/${asset_name}
          mv ./target/x86_64-unknown-linux-gnu/release/libkeryx*.so ${asset_name}/
          cp ./assets/coin-sound-LICENSE.txt ${asset_name}/coin-sound-LICENSE.txt
          tar czvf ${asset_name}.tgz ${asset_name}
          echo "archive=${asset_name}.tgz" >> $GITHUB_ENV
          echo "asset_name=${asset_name}.tgz" >> $GITHUB_ENV


      - name: Build on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --target=x86_64-pc-windows-msvc --release --all --features ${{ matrix.features }}
          feature_name=${{ matrix.features }}
          asset_name="kaspa-miner-${{ github.event.release.tag_name }}-${feature_name/\//-}-win64-amd64"
          mkdir ${asset_name}
          mv ./target/x86_64-pc-windows-msvc/release/keryx-miner.exe ${asset_name}/${asset_name}.exe
          mv ./target/x86_64-pc-windows-msvc/release/keryx*.dll ${asset_name}/
          bash ./integrations/windows/create_bat.sh ${asset_name}
          cp ./assets/coin-sound-LICENSE.txt ${asset_name}/coin-sound-LICENSE.txt
          7z a -tzip -r ${asset_name}.zip ${asset_name}
          echo "archive=${asset_name}.zip" >> $GITHUB_ENV
          echo "asset_name=${asset_name}.zip" >> $GITHUB_ENV

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: "./${{ env.archive }}"
          asset_name: "${{ env.asset_name }}"
          asset_content_type: application/zip

  intergrations:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        itegration: [ hiveos ]
    name: Integrating, ${{ matrix.itegration }}
    steps:
      - name: Fix LibOpenCL on Linux
        run: |
          sudo apt update
          sudo apt install ocl-icd-opencl-dev -y

      - name: Check out code into the module directory
        uses: actions/checkout@v2

      - name: Install Protoc
        uses: arduino/setup-protoc@v1

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install CUDA Linux
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.2.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'

      - name: Build ${{ matrix.itegration }} Script
        run: |
          cargo build --target=x86_64-unknown-linux-gnu --release --all
          binary_name="kaspa-miner-${{ github.event.release.tag_name }}-linux-gnu-amd64"
          asset_name="kaspa-miner-${{ matrix.itegration }}"
          strip ./target/x86_64-unknown-linux-gnu/release/keryx-miner
          mkdir kaspa-miner
          mv ./target/x86_64-unknown-linux-gnu/release/keryx-miner kaspa-miner/${binary_name}
          mv ./target/x86_64-unknown-linux-gnu/release/libkeryx*.so kaspa-miner/
          bash integrations/${{ matrix.itegration }}/build.sh "${{ github.event.release.tag_name }}" "${binary_name}" kaspa-miner 
          echo "archive=${asset_name}.tgz" >> $GITHUB_ENV
          echo "asset_name=${asset_name}.tgz" >> $GITHUB_ENV

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: "./${{ env.archive }}"
          asset_name: "${{ env.asset_name }}"
          asset_content_type: application/zip
