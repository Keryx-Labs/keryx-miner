[package]
name = "keryx-inference"
version = "1.1.1"
edition = "2021"
rust-version = "1.88.0"
license = "ISC"
description = "OPoI (Optimistic Proof of Inference) — synthetic MLP engine for Keryx miners"

[dependencies]
chacha20poly1305 = "0.10.1"
hex = { version = "0.4", features = ["serde"] }
hmac = { version = "0.12.1", default-features = false }
rand = "0.8"
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std"] }
sha2 = "0.10"
thiserror = "1"
